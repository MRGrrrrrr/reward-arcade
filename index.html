<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎮 奖励游戏厅（离线版）</title>
  <style>
/* =========================================================
 * 🎮 奖励游戏厅 · FC 像素风样式
 * ========================================================= */
:root {
  --ink: #20223a;
  --paper: #fffdf4;
  --cream: #fff6dd;
  --bg: #f6ead2;
  --red: #e73e52;
  --yellow: #ffd23f;
  --blue: #4d9de0;
  --green: #59c135;
  --purple: #9b5de5;
  --pink: #f15bb5;
  --orange: #f9844a;
  --muted: #7a7390;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --font: "Courier New", ui-monospace, "PingFang SC", "Hiragino Sans GB", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    repeating-conic-gradient(rgba(32, 34, 58, .045) 0% 25%, transparent 0% 50%);
  background-size: 16px 16px;
}

#confetti {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  pointer-events: none; z-index: 999;
}

.app {
  max-width: 400px;
  margin: 0 auto;
  padding: 14px 14px 60px;
}

/* ---------- 顶部栏 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.kid { display: flex; align-items: center; gap: 10px; }
.kid-avatar {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-size: 22px;
  background: var(--yellow);
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.kid-name { font-weight: 700; font-size: 17px; letter-spacing: 1px; }
.kid-streak { font-size: 11px; color: var(--muted); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.points-chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--red); color: var(--paper);
  font-weight: 700; font-size: 15px;
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 5px 10px;
}
.points-chip .star { font-size: 14px; }
.icon-btn {
  width: 36px; height: 36px;
  font-size: 16px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  cursor: pointer;
  display: grid; place-items: center;
}
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

/* ---------- 游戏标签页 ---------- */
.game-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gtab { flex: 1 1 20%; min-width: 68px; }
.gtab {
  flex: 1;
  font-family: var(--font);
  font-weight: 700; font-size: 13px;
  padding: 9px 2px;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  white-space: nowrap;
}
.gtab.active {
  background: var(--ink); color: var(--yellow);
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}
.gtab:not(.active):active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

/* ---------- 游戏画布 ---------- */
.game-card {
  position: relative;
  border: 4px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  background: #241f3d;
  line-height: 0;
}
#gameCanvas {
  width: 100%;
  display: block;
  aspect-ratio: 192 / 288;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
}
/* 扫描线装饰 */
.game-card::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(32, 34, 58, .07) 0 1px,
    transparent 1px 3px
  );
}
.game-over {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(32, 34, 58, .88);
  color: var(--yellow);
  font-weight: 700; font-size: 16px;
  text-align: center; line-height: 1.8;
  z-index: 2;
}
.hidden { display: none !important; }

/* ---------- 主按钮 / 信息条 ---------- */
.coin-btn {
  width: 100%;
  margin-top: 14px;
  font-family: var(--font);
  font-weight: 700; font-size: 15px;
  letter-spacing: 2px;
  padding: 12px;
  color: var(--ink);
  background: linear-gradient(180deg, #ffe27a 0%, #f5b81d 100%);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.coin-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.gacha-btn {
  width: 100%;
  margin-top: 14px;
  font-family: var(--font);
  font-weight: 700; font-size: 17px;
  letter-spacing: 2px;
  padding: 14px;
  color: var(--ink);
  background: var(--yellow);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.gacha-btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.gacha-btn:disabled { background: #ddd6c2; color: var(--muted); cursor: default; }

.wheel-info {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--ink);
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  padding: 8px 10px;
  line-height: 1.6;
}

/* ---------- 清单 / 记录 ---------- */
.section-title {
  margin: 22px 0 10px;
  font-weight: 700; font-size: 15px;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before,
.section-title::after {
  content: '';
  flex: 1; height: 3px;
  background: var(--ink);
}

.prize-rows { display: flex; flex-direction: column; gap: 8px; }
.prize-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  padding: 9px 12px;
}
.pr-icon {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-size: 17px;
  background: var(--cream);
  border: 2px solid var(--ink);
  flex: none;
}
.pr-label { flex: 1; font-weight: 700; font-size: 14px; }
.pr-count { flex: none; font-size: 11px; color: var(--muted); }

.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-empty {
  text-align: center; color: var(--muted);
  font-size: 13px; line-height: 2;
  border: 3px dashed var(--muted);
  padding: 20px 10px;
}
.history-day {
  font-size: 11px; color: var(--muted);
  margin-top: 6px; font-weight: 700;
}
.history-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--paper);
  border: 2px solid var(--ink);
  padding: 7px 10px;
  font-size: 13px;
}
.hi-icon { flex: none; font-size: 16px; }
.hi-text { flex: 1; font-weight: 700; }

/* ---------- 通用按钮 ---------- */
.btn {
  font-family: var(--font);
  font-weight: 700; font-size: 14px;
  padding: 10px 18px;
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  color: var(--ink);
  background: var(--paper);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn-primary { background: var(--yellow); }
.btn-secondary { background: var(--paper); }
.btn-danger { background: var(--red); color: var(--paper); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(32, 34, 58, .72);
  display: grid; place-items: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  width: 100%; max-width: 330px;
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
  padding: 24px 18px 20px;
  text-align: center;
  animation: pop-in .18s steps(3) both;
}
@keyframes pop-in {
  from { transform: scale(.6); }
  to { transform: scale(1); }
}
.m-emoji { font-size: 44px; margin-bottom: 8px; }
.m-title { font-weight: 700; font-size: 19px; letter-spacing: 2px; margin-bottom: 10px; }
.m-desc { font-size: 13px; line-height: 1.9; color: #4a4560; margin-bottom: 14px; }
.m-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
.modal input {
  width: 100%;
  font-family: var(--font); font-size: 16px;
  text-align: center;
  padding: 10px;
  border: 3px solid var(--ink);
  background: var(--cream);
  margin-bottom: 4px;
  outline: none;
}

/* ---------- toast ---------- */
#toast {
  position: fixed;
  left: 50%; bottom: 90px;
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  font-family: var(--font);
  font-weight: 700; font-size: 13px;
  padding: 10px 18px;
  border: 3px solid var(--paper);
  box-shadow: var(--shadow-sm);
  z-index: 300;
  white-space: nowrap;
  animation: toast-in .15s steps(2) both;
}
@keyframes toast-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 家长后台 ---------- */
.admin-mask {
  position: fixed; inset: 0;
  background: rgba(32, 34, 58, .72);
  z-index: 200;
  display: grid; place-items: center;
  padding: 16px;
}
.admin-panel {
  width: 100%; max-width: 420px;
  max-height: 86vh;
  display: flex; flex-direction: column;
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
}
.admin-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--ink); color: var(--yellow);
  font-weight: 700; font-size: 15px;
}
.admin-tabs { display: flex; border-bottom: 3px solid var(--ink); }
.atab {
  flex: 1;
  font-family: var(--font); font-weight: 700; font-size: 13px;
  padding: 10px;
  background: var(--cream);
  border: none; border-right: 3px solid var(--ink);
  cursor: pointer;
}
.atab:last-child { border-right: none; }
.atab.active { background: var(--yellow); }
.admin-body { padding: 14px; overflow-y: auto; }

.a-section-title { font-weight: 700; font-size: 14px; margin: 12px 0 8px; }
.a-section-title:first-child { margin-top: 0; }
.a-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.a-row input {
  font-family: var(--font); font-size: 13px;
  padding: 8px;
  border: 2px solid var(--ink);
  background: var(--cream);
  outline: none;
  min-width: 0;
}
.a-row .grow { flex: 1; }
.a-del {
  flex: none;
  width: 30px; height: 30px;
  font-family: var(--font); font-weight: 700;
  background: var(--red); color: var(--paper);
  border: 2px solid var(--ink);
  cursor: pointer;
}
.a-add {
  width: 100%;
  font-family: var(--font); font-weight: 700; font-size: 13px;
  padding: 10px;
  background: var(--green); color: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  margin-bottom: 8px;
}
.a-add:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.a-actions { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.a-note {
  font-size: 11px; color: var(--muted);
  line-height: 1.8;
  background: var(--cream);
  border: 2px dashed var(--muted);
  padding: 8px 10px;
  margin-top: 8px;
}

/* 中奖弹窗彩带边框 */
.modal .m-title { color: var(--red); }

  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="kid">
        <span class="kid-avatar">🎮</span>
        <div class="kid-meta">
          <div class="kid-name">奖励游戏厅</div>
          <div class="kid-streak" id="drawCount">已弹 0 次</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnSound" title="声音开关">🔊</button>
        <div class="points-chip" id="remainChip">
          <span class="star">🎁</span><span id="remainVal">12</span>
        </div>
        <button class="icon-btn" id="btnParent" title="家长设置">⚙️</button>
      </div>
    </header>

    <!-- 主区域 -->
    <main class="main">
      <div class="game-tabs">
        <button class="gtab active" data-game="pinball">🎱 弹珠</button>
        <button class="gtab" data-game="duck">🦆 鸭子</button>
        <button class="gtab" data-game="fish">🎣 钓鱼</button>
        <button class="gtab" data-game="soccer">⚽ 足球</button>
        <button class="gtab" data-game="archery">🏹 弓箭</button>
      </div>
      <div class="game-card">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over hidden" id="gameOver">🎉 全部弹完啦！<br>请家长补充奖品</div>
      </div>

      <button class="coin-btn" id="btnCoin">🪙 投币 · 随机开游戏</button>
      <button class="gacha-btn" id="btnPull">🎰 拉杆 · 发射弹珠</button>
      <div class="wheel-info" id="wheelInfo">剩余奖品 <b>12</b> 份 · 拉一下杆子试试手气</div>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- 家长后台 -->
  <div class="admin-mask hidden" id="adminMask">
    <div class="admin-panel">
      <div class="admin-head">
        <span>🛠️ 家长后台</span>
        <button class="icon-btn" id="adminClose">✖️</button>
      </div>
      <div class="admin-tabs">
        <button class="atab active" data-atab="prizes">奖品</button>
        <button class="atab" data-atab="basic">设置</button>
        <button class="atab" data-atab="data">数据</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>

  <script src="img/duckFly1.js"></script>
  <script src="img/duckFly2.js"></script>
  <script src="img/duckHit.js"></script>
  <script src="img/fishS.js"></script>
  <script src="img/fishM.js"></script>
  <script src="img/fishL.js"></script>
  <script src="img/fishSDead.js"></script>
  <script src="img/fishMDead.js"></script>
  <script src="img/fishLDead.js"></script>
  <script src="js/part01.js"></script>
  <script src="js/part02.js"></script>
  <script src="js/part03.js"></script>
  <script src="js/part04.js"></script>
  <script src="js/part05.js"></script>
  <script src="js/part06.js"></script>
  <script src="js/part07.js"></script>
  <script src="js/part08.js"></script>
  <script src="js/part09.js"></script>
  <script src="js/part10.js"></script>
  <script src="js/part11.js"></script>
</body>
</html>
