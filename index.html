<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎮 奖励游戏厅（离线版）</title>
  <style>
/* =========================================================
 * 🎮 奖励游戏厅 · FC 像素风样式
 * ========================================================= */
:root {
  --ink: #20223a;
  --paper: #fffdf4;
  --cream: #fff6dd;
  --bg: #f6ead2;
  --red: #e73e52;
  --yellow: #ffd23f;
  --blue: #4d9de0;
  --green: #59c135;
  --purple: #9b5de5;
  --pink: #f15bb5;
  --orange: #f9844a;
  --muted: #7a7390;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --font: "Courier New", ui-monospace, "PingFang SC", "Hiragino Sans GB", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    repeating-conic-gradient(rgba(32, 34, 58, .045) 0% 25%, transparent 0% 50%);
  background-size: 16px 16px;
}

#confetti {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  pointer-events: none; z-index: 999;
}

.app {
  max-width: 400px;
  margin: 0 auto;
  padding: 14px 14px 60px;
}

/* ---------- 顶部栏 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.kid { display: flex; align-items: center; gap: 10px; }
.kid-avatar {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-size: 22px;
  background: var(--yellow);
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.kid-name { font-weight: 700; font-size: 17px; letter-spacing: 1px; }
.kid-streak { font-size: 11px; color: var(--muted); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.points-chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--red); color: var(--paper);
  font-weight: 700; font-size: 15px;
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 5px 10px;
}
.points-chip .star { font-size: 14px; }
.icon-btn {
  width: 36px; height: 36px;
  font-size: 16px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  cursor: pointer;
  display: grid; place-items: center;
}
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

/* ---------- 游戏标签页 ---------- */
.game-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gtab { flex: 1 1 20%; min-width: 68px; }
.gtab {
  flex: 1;
  font-family: var(--font);
  font-weight: 700; font-size: 13px;
  padding: 9px 2px;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  white-space: nowrap;
}
.gtab.active {
  background: var(--ink); color: var(--yellow);
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}
.gtab:not(.active):active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

/* ---------- 游戏画布 ---------- */
.game-card {
  position: relative;
  border: 4px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  background: #241f3d;
  line-height: 0;
}
#gameCanvas {
  width: 100%;
  display: block;
  aspect-ratio: 192 / 288;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
}
/* 扫描线装饰 */
.game-card::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(32, 34, 58, .07) 0 1px,
    transparent 1px 3px
  );
}
.game-over {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(32, 34, 58, .88);
  color: var(--yellow);
  font-weight: 700; font-size: 16px;
  text-align: center; line-height: 1.8;
  z-index: 2;
}
.hidden { display: none !important; }

/* ---------- 主按钮 / 信息条 ---------- */
.coin-btn {
  width: 100%;
  margin-top: 14px;
  font-family: var(--font);
  font-weight: 700; font-size: 15px;
  letter-spacing: 2px;
  padding: 12px;
  color: var(--ink);
  background: linear-gradient(180deg, #ffe27a 0%, #f5b81d 100%);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.coin-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.gacha-btn {
  width: 100%;
  margin-top: 14px;
  font-family: var(--font);
  font-weight: 700; font-size: 17px;
  letter-spacing: 2px;
  padding: 14px;
  color: var(--ink);
  background: var(--yellow);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.gacha-btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.gacha-btn:disabled { background: #ddd6c2; color: var(--muted); cursor: default; }

.wheel-info {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--ink);
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  padding: 8px 10px;
  line-height: 1.6;
}

/* ---------- 清单 / 记录 ---------- */
.section-title {
  margin: 22px 0 10px;
  font-weight: 700; font-size: 15px;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before,
.section-title::after {
  content: '';
  flex: 1; height: 3px;
  background: var(--ink);
}

.prize-rows { display: flex; flex-direction: column; gap: 8px; }
.prize-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  padding: 9px 12px;
}
.pr-icon {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-size: 17px;
  background: var(--cream);
  border: 2px solid var(--ink);
  flex: none;
}
.pr-label { flex: 1; font-weight: 700; font-size: 14px; }
.pr-count { flex: none; font-size: 11px; color: var(--muted); }

.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-empty {
  text-align: center; color: var(--muted);
  font-size: 13px; line-height: 2;
  border: 3px dashed var(--muted);
  padding: 20px 10px;
}
.history-day {
  font-size: 11px; color: var(--muted);
  margin-top: 6px; font-weight: 700;
}
.history-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--paper);
  border: 2px solid var(--ink);
  padding: 7px 10px;
  font-size: 13px;
}
.hi-icon { flex: none; font-size: 16px; }
.hi-text { flex: 1; font-weight: 700; }

/* ---------- 通用按钮 ---------- */
.btn {
  font-family: var(--font);
  font-weight: 700; font-size: 14px;
  padding: 10px 18px;
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  color: var(--ink);
  background: var(--paper);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn-primary { background: var(--yellow); }
.btn-secondary { background: var(--paper); }
.btn-danger { background: var(--red); color: var(--paper); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(32, 34, 58, .72);
  display: grid; place-items: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  width: 100%; max-width: 330px;
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
  padding: 24px 18px 20px;
  text-align: center;
  animation: pop-in .18s steps(3) both;
}
@keyframes pop-in {
  from { transform: scale(.6); }
  to { transform: scale(1); }
}
.m-emoji { font-size: 44px; margin-bottom: 8px; }
.m-title { font-weight: 700; font-size: 19px; letter-spacing: 2px; margin-bottom: 10px; }
.m-desc { font-size: 13px; line-height: 1.9; color: #4a4560; margin-bottom: 14px; }
.m-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
.modal input {
  width: 100%;
  font-family: var(--font); font-size: 16px;
  text-align: center;
  padding: 10px;
  border: 3px solid var(--ink);
  background: var(--cream);
  margin-bottom: 4px;
  outline: none;
}

/* ---------- toast ---------- */
#toast {
  position: fixed;
  left: 50%; bottom: 90px;
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  font-family: var(--font);
  font-weight: 700; font-size: 13px;
  padding: 10px 18px;
  border: 3px solid var(--paper);
  box-shadow: var(--shadow-sm);
  z-index: 300;
  white-space: nowrap;
  animation: toast-in .15s steps(2) both;
}
@keyframes toast-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 家长后台 ---------- */
.admin-mask {
  position: fixed; inset: 0;
  background: rgba(32, 34, 58, .72);
  z-index: 200;
  display: grid; place-items: center;
  padding: 16px;
}
.admin-panel {
  width: 100%; max-width: 420px;
  max-height: 86vh;
  display: flex; flex-direction: column;
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
}
.admin-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--ink); color: var(--yellow);
  font-weight: 700; font-size: 15px;
}
.admin-tabs { display: flex; border-bottom: 3px solid var(--ink); }
.atab {
  flex: 1;
  font-family: var(--font); font-weight: 700; font-size: 13px;
  padding: 10px;
  background: var(--cream);
  border: none; border-right: 3px solid var(--ink);
  cursor: pointer;
}
.atab:last-child { border-right: none; }
.atab.active { background: var(--yellow); }
.admin-body { padding: 14px; overflow-y: auto; }

.a-section-title { font-weight: 700; font-size: 14px; margin: 12px 0 8px; }
.a-section-title:first-child { margin-top: 0; }
.a-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.a-row input {
  font-family: var(--font); font-size: 13px;
  padding: 8px;
  border: 2px solid var(--ink);
  background: var(--cream);
  outline: none;
  min-width: 0;
}
.a-row .grow { flex: 1; }
.a-del {
  flex: none;
  width: 30px; height: 30px;
  font-family: var(--font); font-weight: 700;
  background: var(--red); color: var(--paper);
  border: 2px solid var(--ink);
  cursor: pointer;
}
.a-add {
  width: 100%;
  font-family: var(--font); font-weight: 700; font-size: 13px;
  padding: 10px;
  background: var(--green); color: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  margin-bottom: 8px;
}
.a-add:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.a-actions { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.a-note {
  font-size: 11px; color: var(--muted);
  line-height: 1.8;
  background: var(--cream);
  border: 2px dashed var(--muted);
  padding: 8px 10px;
  margin-top: 8px;
}

/* 中奖弹窗彩带边框 */
.modal .m-title { color: var(--red); }

  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="kid">
        <span class="kid-avatar">🎮</span>
        <div class="kid-meta">
          <div class="kid-name">奖励游戏厅</div>
          <div class="kid-streak" id="drawCount">已弹 0 次</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnSound" title="声音开关">🔊</button>
        <div class="points-chip" id="remainChip">
          <span class="star">🎁</span><span id="remainVal">12</span>
        </div>
        <button class="icon-btn" id="btnParent" title="家长设置">⚙️</button>
      </div>
    </header>

    <!-- 主区域 -->
    <main class="main">
      <div class="game-tabs">
        <button class="gtab active" data-game="pinball">🎱 弹珠</button>
        <button class="gtab" data-game="duck">🦆 鸭子</button>
        <button class="gtab" data-game="fish">🎣 钓鱼</button>
        <button class="gtab" data-game="soccer">⚽ 足球</button>
        <button class="gtab" data-game="archery">🏹 弓箭</button>
      </div>
      <div class="game-card">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over hidden" id="gameOver">🎉 全部弹完啦！<br>请家长补充奖品</div>
      </div>

      <button class="coin-btn" id="btnCoin">🪙 投币 · 随机开游戏</button>
      <button class="gacha-btn" id="btnPull">🎰 拉杆 · 发射弹珠</button>
      <div class="wheel-info" id="wheelInfo">剩余奖品 <b>12</b> 份 · 拉一下杆子试试手气</div>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- 家长后台 -->
  <div class="admin-mask hidden" id="adminMask">
    <div class="admin-panel">
      <div class="admin-head">
        <span>🛠️ 家长后台</span>
        <button class="icon-btn" id="adminClose">✖️</button>
      </div>
      <div class="admin-tabs">
        <button class="atab active" data-atab="prizes">奖品</button>
        <button class="atab" data-atab="basic">设置</button>
        <button class="atab" data-atab="data">数据</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>

  <script>
/* =========================================================
 * 🎮 奖励游戏厅 · FC 像素风三合一（弹珠机 / 打鸭子 / 钓鱼）
 *  - 开局把全部奖券副本铺进游戏目标（牌 / 鸭子 / 鱼）
 *  - Web Audio 全合成音效 + 芯片音乐（无需任何音频素材）
 *  - 逻辑分辨率 192x288，CSS 像素放大
 * 数据存 localStorage，奖品不消耗（份数 = 目标数量）。
 * ========================================================= */
'use strict';

const STORE_KEY = 'lucky-wheel-v1';

/* ---------- 默认数据 ---------- */
const DEFAULTS = {
  parentPin: '1234',
  prizes: [
    { id: 'p1', icon: '🛒', label: '山姆购物券 100 元', stock: 2, total: 2 },
    { id: 'p2', icon: '🛒', label: '山姆购物券 50 元',  stock: 6, total: 6 },
    { id: 'p3', icon: '🍽️', label: '美食券',           stock: 1, total: 1 },
    { id: 'p4', icon: '🌳', label: '户外游玩券',       stock: 1, total: 1 },
    { id: 'p5', icon: '🎬', label: '电影券',           stock: 1, total: 1 },
    { id: 'p6', icon: '🎮', label: '游戏 1 小时券',    stock: 1, total: 1 },
  ],
  history: [], // { t, label, icon, game }
  coins: 0,    // 累计投币数
};

/* ---------- 状态 ---------- */
let state = load();
let isAdmin = false;
let active = 'pinball'; // pinball | duck | fish

/* 离线单文件（file://）环境下 localStorage 可能不可用，退化为内存存档 */
let memStore = null;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign({}, structuredClone(DEFAULTS), JSON.parse(raw));
  } catch (e) { console.warn('读取存档失败，使用默认数据', e); }
  if (memStore) {
    try { return Object.assign({}, structuredClone(DEFAULTS), JSON.parse(memStore)); } catch (e) {}
  }
  return structuredClone(DEFAULTS);
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    memStore = JSON.stringify(state);
  }
}
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = sel => document.querySelector(sel);
const totalRemaining = () => state.prizes.reduce((s, p) => s + Math.max(0, p.stock), 0);

const fmtTime = ts => {
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const fmtDate = ts => {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return '今天';
  const y = new Date(today); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
};

function shortLabel(label) {
  if (label.includes('100')) return '100元';
  if (label.includes('50')) return '50元';
  return label.replace(/券/g, '').replace(/\s/g, '').slice(0, 2) || '奖品';
}

/* 展开奖券副本：每种奖券按份数生成目标，全部一次性入局，再洗牌 */
function buildDeck() {
  let deck = [];
  state.prizes.forEach(p => { for (let i = 0; i < Math.max(0, p.stock); i++) deck.push(p); });
  if (!deck.length) deck = state.prizes.slice();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

/* =========================================================
 * 🔊 音频引擎：Web Audio 全合成（8-bit 芯片风）
 * ========================================================= */
const Sound = (() => {
  let ac = null, master, musicGain, sfxGain;
  let muted = false;
  try { muted = localStorage.getItem('arcade-muted') === '1'; } catch (e) {}
  let musicTimer = null, musicOn = false;

  function ensure() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return true; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
      sfxGain = ac.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(master);
      musicGain = ac.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
      return true;
    } catch { return false; }
  }

  function tone({ f = 440, f1 = 0, t = 0, dur = 0.12, type = 'square', vol = 0.16, dest = null }) {
    if (!ensure()) return;
    const now = ac.currentTime + t;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f), now);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(now); o.stop(now + dur + 0.05);
  }

  let noiseBuf = null;
  function noise({ t = 0, dur = 0.2, vol = 0.2, f = 1000, f1 = 0, q = 1.2, type = 'lowpass' }) {
    if (!ensure()) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const now = ac.currentTime + t;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, now);
    if (f1) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(fl); fl.connect(g); g.connect(sfxGain);
    src.start(now); src.stop(now + dur + 0.05);
  }

  /* 背景音乐：C–Am–F–G 活泼芯片循环（方波旋律 + 三角波贝斯 + 噪声镲） */
  const MEL = [
    72, 0, 76, 0, 79, 0, 76, 0, 81, 0, 79, 0, 76, 0, 74, 0,
    72, 0, 76, 0, 79, 0, 81, 0, 79, 0, 76, 0, 74, 0, 72, 0,
  ];
  const BASS = [48, 45, 41, 43]; // C3 Am F2 G2
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const STEP = 60 / 150 / 2; // 150bpm 八分音符
  let step = 0, nextT = 0;

  function schedule() {
    if (!ac) return;
    while (nextT < ac.currentTime + 0.16) {
      const m = MEL[step % MEL.length];
      if (m) {
        tone({ f: mf(m), t: nextT - ac.currentTime, dur: STEP * 0.92, type: 'square', vol: 0.42, dest: musicGain });
      }
      if (step % 8 === 0) {
        const b = BASS[((step / 8) | 0) % BASS.length];
        tone({ f: mf(b), t: nextT - ac.currentTime, dur: STEP * 7.4, type: 'triangle', vol: 0.85, dest: musicGain });
      }
      if (step % 2 === 1) {
        noise({ t: nextT - ac.currentTime, dur: 0.03, vol: 0.05, f: 7000, type: 'highpass' });
      }
      nextT += STEP; step++;
    }
  }
  function startMusic() {
    if (!ensure() || musicOn) return;
    musicOn = true;
    step = 0; nextT = ac.currentTime + 0.08;
    musicTimer = setInterval(schedule, 42);
  }

  const sfx = {
    click()   { tone({ f: 880, f1: 660, dur: 0.06, vol: 0.1 }); },
    shuffle() { [660, 770, 880, 990].forEach((f, i) => tone({ f, t: i * 0.06, dur: 0.06, vol: 0.11 })); },
    deal()    { tone({ f: 1150 + Math.random() * 250, dur: 0.03, type: 'triangle', vol: 0.07 }); },
    ratchet() { noise({ dur: 0.03, vol: 0.1, f: 2600, type: 'highpass' }); },
    launch()  { tone({ f: 170, f1: 760, dur: 0.2, type: 'sine', vol: 0.24 }); noise({ dur: 0.06, vol: 0.12, f: 2200, type: 'highpass' }); },
    peg()     { tone({ f: 1100 + Math.random() * 350, dur: 0.035, type: 'triangle', vol: 0.07 }); },
    flip()    { noise({ dur: 0.09, vol: 0.14, f: 900, f1: 2600, q: 2, type: 'bandpass' }); tone({ f: 700, t: 0.08, dur: 0.09, vol: 0.12 }); },
    quack()   { for (let i = 0; i < 2; i++) { const t = i * 0.15; tone({ f: 430, f1: 220, t, dur: 0.12, type: 'sawtooth', vol: 0.14 }); noise({ t, dur: 0.11, vol: 0.09, f: 900, q: 3, type: 'bandpass' }); } },
    duckFall(){ tone({ f: 420, f1: 130, dur: 0.35, type: 'sawtooth', vol: 0.13 }); },
    hit()     { noise({ dur: 0.12, vol: 0.2, f: 1800, type: 'highpass' }); tone({ f: 320, f1: 110, dur: 0.16, vol: 0.18 }); },
    thud()    { tone({ f: 150, f1: 60, dur: 0.15, type: 'sine', vol: 0.26 }); },
    splash()  { noise({ dur: 0.34, vol: 0.22, f: 1500, f1: 260 }); tone({ f: 500, f1: 100, dur: 0.28, type: 'sine', vol: 0.13 }); },
    cast()    { noise({ dur: 0.13, vol: 0.13, f: 2400, f1: 500 }); },
    bite()    { noise({ dur: 0.18, vol: 0.2, f: 1300, f1: 320 }); tone({ f: 620, f1: 980, dur: 0.12, vol: 0.14 }); },
    reel()    { tone({ f: 950, dur: 0.03, type: 'triangle', vol: 0.055 }); },
    pop()     { tone({ f: 300, f1: 640, dur: 0.08, vol: 0.13 }); },
    bang()    { noise({ dur: 0.09, vol: 0.26, f: 3200, type: 'highpass' }); tone({ f: 220, f1: 55, dur: 0.13, type: 'square', vol: 0.2 }); },
    coin()    { tone({ f: 988, f1: 1319, dur: 0.1, type: 'sine', vol: 0.2 }); tone({ f: 1568, t: 0.09, dur: 0.16, type: 'sine', vol: 0.18 }); noise({ t: 0.02, dur: 0.05, vol: 0.15, f: 1800, type: 'highpass' }); },
    win()     { [523, 659, 784, 1047].forEach((f, i) => { tone({ f, t: i * 0.09, dur: 0.18, vol: 0.15 }); tone({ f: f / 2, t: i * 0.09, dur: 0.18, type: 'triangle', vol: 0.1 }); }); },
    lose()    { [392, 330, 262].forEach((f, i) => tone({ f, t: i * 0.12, dur: 0.15, type: 'triangle', vol: 0.14 })); },
  };

  function toggle() {
    muted = !muted;
    try { localStorage.setItem('arcade-muted', muted ? '1' : '0'); } catch (e) {}
    if (ensure()) master.gain.value = muted ? 0 : 1;
    return muted;
  }

  return { sfx, startMusic, toggle, get muted() { return muted; }, ensure };
})();

/* 撒花动画 */
const confettiCv = $('#confetti');
const cctx = confettiCv.getContext('2d');
let confettiParts = [];
function resizeConfetti() {
  confettiCv.width = innerWidth; confettiCv.height = innerHeight;
}
addEventListener('resize', resizeConfetti); resizeConfetti();

const CONF_COLORS = ['#ffd23f', '#f15bb5', '#4d9de0', '#59c135', '#f9844a', '#9b5de5'];
function burst(count = 130) {
  for (let i = 0; i < count; i++) {
    confettiParts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 160,
      y: innerHeight * .35,
      vx: (Math.random() - .5) * 11,
      vy: Math.random() * -9 - 3,
      size: 5 + Math.random() * 7,
      color: CONF_COLORS[i % CONF_COLORS.length],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      life: 90 + Math.random() * 50,
    });
  }
  if (!confettiParts._run) { confettiParts._run = true; tickConfetti(); }
}
function tickConfetti() {
  cctx.clearRect(0, 0, confettiCv.width, confettiCv.height);
  confettiParts = confettiParts.filter(p => p.life-- > 0 && p.y < innerHeight + 30);
  for (const p of confettiParts) {
    p.vy += .25; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color; cctx.globalAlpha = Math.min(1, p.life / 40);
    cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .6);
    cctx.restore();
  }
  if (confettiParts.length) requestAnimationFrame(tickConfetti);
  else confettiParts._run = false;
}

const pxFont = (s, w = 700) => `${w} ${s}px "Courier New", ui-monospace, monospace`;

  ctx.textBaseline = 'middle';

};

/* 像素圆 / 像素椭圆：栅格化成 1px 方块 */
function pxCirc(x, y, r, color, rY = null) {
  const ry = rY === null ? r : rY;
  const cx = Math.round(x), cy = Math.round(y);
  const R = Math.ceil(Math.max(r, ry));
  ctx.fillStyle = color;
  for (let gy = -R; gy <= R; gy++) {
    for (let gx = -R; gx <= R; gx++) {
      const nx = gx / (r + 0.35), ny = gy / (ry + 0.35);
      if (nx * nx + ny * ny <= 1) ctx.fillRect(cx + gx, cy + gy, 1, 1);
    }
  }
}
function pxEllipse(x, y, rx, ry, color) { pxCirc(x, y, rx, color, ry); }

/* 像素精灵：字符画 → 像素块。pal: {字符: 颜色} */
function drawSprite(map, pal, x, y, flip = false) {
  const w = map[0].length;
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[flip ? w - 1 - c : c];
      const col = pal[ch];
      if (col) ctx.fillRect(Math.round(x) + c, Math.round(y) + r, 1, 1);
    }
  }
}

function drawImgCentered(img, x, y, w, flip = false, rot = 0) {
  const h = img.height * (w / img.width);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
  return h;
}

function resizeGame() {
  view.W = 192; view.H = 288; view.dpr = 1;
  cv.width = 192; cv.height = 288;
  ctx.imageSmoothingEnabled = false;
  layoutPinball();
}
addEventListener('resize', resizeGame);

/* =========================================================
 * 🎰 游戏一：翻牌弹珠机
 * cover → shuffling → ready → pulling → falling → settled → revealing
 * ========================================================= */
const game = {
  slots: [], pegs: [],
  N: 0, slotW: 0, slotH: 50,
  ball: { x: 0, y: 0, vx: 0, vy: 0, r: 6, active: false, rest: 0 },
  phase: 'cover',
  leverT: 0, flash: -1, won: false,
  sndT: 0,
  trail: [], sparks: [],
};

function layoutPinball() {
  const { W, H } = view;
  game.slotH = Math.max(44, Math.min(62, W * 0.26));
  game.N = game.slots.length;
  game.slotW = game.N > 0 ? W / game.N : W;
  game.pegs = [];
  if (game.N >= 2) {
    const rows = Math.min(game.N + 1, 9);
    const top = 66;
    const bottom = H - game.slotH - 14;
    game.ball.r = Math.max(5, Math.min(8, game.slotW * 0.18));
    const pegR = Math.max(3, game.ball.r * 0.72);
    for (let r = 0; r < rows; r++) {
      const y = top + (bottom - top) * (rows === 1 ? 0 : r / (rows - 1));
      const off = (r % 2 === 0) ? game.slotW / 2 : 0;
      for (let i = 0; i < game.N - 1; i++) {
        const x = off + game.slotW / 2 + i * game.slotW;
        game.pegs.push({ x: Math.min(W - pegR - 2, Math.max(pegR + 2, x)), y, r: pegR });
      }
    }
  } else {
    game.ball.r = 6;
  }
}

function setupBoard() {
  game.won = false;
  game.flash = -1;
  game.N = state.prizes.length;
  if (game.N === 0) {
    game.phase = 'over';
    game.slots = [];
    $('#gameOver').classList.remove('hidden');
    renderHeader();
    return;
  }
  $('#gameOver').classList.add('hidden');
  game.slots = buildDeck().map(prize => ({ prize, front: false, t: 1 }));
  game.phase = 'cover';
  layoutPinball();
  game.ball = { x: view.W / 2, y: 22, vx: 0, vy: 0, r: game.ball.r || 6, active: false, rest: 0 };
  renderHeader();
}

function shuffle() {
  if (game.phase === 'over') { toast('请先在后台添加奖品 🎁'); return; }
  if (game.phase !== 'cover') return;
  game.phase = 'shuffling';
  Sound.sfx.shuffle();
  renderHeader();
  [240, 500, 760].forEach((ms, idx) => setTimeout(() => {
    if (game.phase !== 'shuffling') return;
    const deal = buildDeck();
    game.slots.forEach((s, i) => { s.prize = deal[i % deal.length]; });
    Sound.sfx.deal();
    if (idx === 2) {
      game.phase = 'ready';
      armed = true;
      renderHeader();
      toast('洗好啦！可以发射弹珠啦 🎱');
    }
  }, ms));
}

function pull() {
  if (game.phase === 'over') { toast('请先在后台添加奖品 🎁'); return; }
  if (game.phase === 'cover') { toast('先点「🔀 洗牌」把奖券打乱，再发射弹珠哦！'); return; }
  if (game.phase !== 'ready') return;
  if (!armed) { needCoin(); return; }
  game.phase = 'pulling';
  game.leverT = 0;
  game.sndT = 0;
  renderHeader();
}

function launch() {
  const b = game.ball;
  b.active = true;
  b.x = view.W / 2 + (Math.random() - .5) * 6;
  b.y = 22;
  b.vx = (Math.random() - .5) * 100;
  b.vy = 0;
  game.phase = 'falling';
  game.trail = []; game.sparks = [];
  armed = false; // 一枚币一弹珠
  Sound.sfx.launch();
}

function leverPivot() { return { x: view.W - 15, y: 62 }; }
function leverKnobPos() {
  const p = leverPivot();
  const ang = (215 - game.leverT * 125) * Math.PI / 180;
  const len = 30;
  return { x: p.x + Math.cos(ang) * len, y: p.y + Math.sin(ang) * len };
}

function stepPinball(dt) {
  if (game.phase === 'pulling') {
    game.leverT = Math.min(1, game.leverT + dt / 0.26);
    game.sndT += dt;
    if (game.sndT > 0.05) { game.sndT = 0; Sound.sfx.ratchet(); }
    if (game.leverT >= 1) launch();
    return;
  }
  if (game.phase === 'falling') {
    game.leverT = Math.max(0, game.leverT - dt / 0.7);
  }
  if (game.phase !== 'falling') return;

  const b = game.ball;
  const g = 900;
  const capY = view.H - game.slotH - b.r + 2;
  let pegSnd = false;
  // 球尾迹 + 火花粒子
  game.trail.push({ x: b.x, y: b.y });
  if (game.trail.length > 8) game.trail.shift();
  game.sparks.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; });
  game.sparks = game.sparks.filter(p => p.life > 0);
  for (let s = 0; s < 2; s++) {
    const h = dt / 2;
    if (b.y <= capY) b.vy += g * h;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 560) { b.vx *= 560 / sp; b.vy *= 560 / sp; }
    b.x += b.vx * h;
    b.y += b.vy * h;

    if (b.x < b.r + 2) { b.x = b.r + 2; b.vx = Math.abs(b.vx) * 0.55; }
    if (b.x > view.W - b.r - 2) { b.x = view.W - b.r - 2; b.vx = -Math.abs(b.vx) * 0.55; }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.5; }

    for (const p of game.pegs) {
      const dx = b.x - p.x, dy = b.y - p.y;
      const minD = b.r + p.r;
      const d2 = dx * dx + dy * dy;
      if (d2 < minD * minD && d2 > 0.0001) {
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        b.x = p.x + nx * minD;
        b.y = p.y + ny * minD;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          const e = 0.45;
          b.vx -= (1 + e) * vn * nx;
          b.vy -= (1 + e) * vn * ny;
          b.vx += (Math.random() - .5) * 50;
          b.vy += (Math.random() - .5) * 20;
          pegSnd = true;
          // 碰撞火花
          for (let k = 0; k < 3; k++) {
            game.sparks.push({
              x: p.x + nx * p.r, y: p.y + ny * p.r,
              vx: nx * 40 + (Math.random() - .5) * 60,
              vy: ny * 40 + (Math.random() - .5) * 60,
              life: 0.2 + Math.random() * 0.1,
            });
          }
        }
      }
    }

    if (b.y > capY) {
      const i = Math.min(game.N - 1, Math.max(0, Math.floor(b.x / game.slotW)));
      const gap = 3;
      const left = i * game.slotW + gap + b.r;
      const right = (i + 1) * game.slotW - gap - b.r;
      b.x = Math.max(left, Math.min(right, b.x));
      b.vy *= 0.86; b.vx *= 0.68;
      const cx = (i + 0.5) * game.slotW;
      b.x += (cx - b.x) * 0.14;
      b.y = Math.min(b.y, view.H - game.slotH * 0.42);
      if (Math.abs(b.vy) < 22) {
        b.vy = 0; b.vx = 0; b.rest += h;
        if (b.rest > 0.18) {
          b.x = cx; b.y = view.H - game.slotH * 0.42;
          addShake(1.5, 0.2);
          game.phase = 'settled';
          game.flash = i;
          settlePinball(i);
          return;
        }
      } else {
        b.rest = 0;
      }
    } else {
      b.rest = 0;
    }
  }
  if (pegSnd) {
    const now = performance.now();
    if (!stepPinball._pegT || now - stepPinball._pegT > 70) {
      Sound.sfx.peg();
      stepPinball._pegT = now;
    }
  }
}

function settlePinball(idx) {
  if (game.won) return;
  game.won = true;
  const slot = game.slots[idx];
  const prize = slot.prize;
  slot.front = true;
  game.phase = 'revealing';
  Sound.sfx.flip();
  recordWin(prize);
  renderPrizeRows(); renderHistory(); renderHeader();
  showWinModal(prize, nextRoundPinball, 700, `弹珠落袋，翻开奖格——`);
}

/* 中奖后不重新发牌：只翻开这一格，其余盖牌保持原位，继续玩；
   全部翻完才换一批新奖券（需重新洗牌） */
function nextRoundPinball() {
  if (game.slots.length && game.slots.every(s => s.front)) { setupBoard(); return; }
  game.won = false;
  game.flash = -1;
  game.phase = 'ready';
  game.ball = { x: view.W / 2, y: 22, vx: 0, vy: 0, r: game.ball.r || 6, active: false, rest: 0 };
  renderHeader();
}

function drawPinball() {
  const { W, H } = view;
  const t = Date.now() / 1000;

  // 机台背景
  ctx.fillStyle = '#241f3d';
  ctx.fillRect(0, 0, W, H);
  // 顶部发射井
  ctx.fillStyle = PIX.ink;
  ctx.fillRect(W / 2 - 14, 2, 28, 24);
  ctx.fillStyle = '#3a3160';
  ctx.fillRect(W / 2 - 11, 4, 22, 20);
  // 星星点缀
  ctx.fillStyle = '#4d4280';
  for (const [sx, sy] of [[16, 40], [W - 30, 30], [30, H * 0.45], [W - 24, H * 0.6], [20, H * 0.72]]) {
    ctx.fillRect(sx, sy, 2, 2);
  }

  // 钉子
  for (const p of game.pegs) {
    pxCirc(p.x, p.y, p.r, PIX.yellow);
    ctx.fillStyle = PIX.ink;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
  }

  // 奖格
  const sh = game.slotH, gap = 3;
  for (let i = 0; i < game.N; i++) {
    const s = game.slots[i];
    if (!s) continue;
    const target = s.front ? 0 : 1;
    s.t += (target - s.t) * 0.16;
    const cx = (i + 0.5) * game.slotW;
    const cy = H - sh / 2 + 1;
    let jx = 0, jy = 0;
    if (game.phase === 'shuffling') {
      jx = (Math.random() - .5) * 5;
      jy = (Math.random() - .5) * 3;
    }
    const w = Math.max(12, game.slotW - gap), h = sh - 8;
    const sx2 = Math.max(0.1, Math.abs(Math.cos(s.t * Math.PI)));
    const flipW = w * sx2;
    ctx.save();
    ctx.translate(Math.round(cx + jx), Math.round(cy + jy));
    if (s.t < 0.5) {
      // 正面：奖券
      ctx.fillStyle = PIX.paper;
      ctx.fillRect(-flipW / 2, -h / 2, flipW, h);
      ctx.fillStyle = PIX.ink;
      ctx.fillRect(-flipW / 2, -h / 2, flipW, 1);
      ctx.fillRect(-flipW / 2, h / 2 - 1, flipW, 1);
      ctx.fillRect(-flipW / 2, -h / 2, 1, h);
      ctx.fillRect(flipW / 2 - 1, -h / 2, 1, h);
      if (i === game.flash && Math.sin(t * 14) > 0) {
        ctx.fillStyle = 'rgba(255,210,63,.55)';
        ctx.fillRect(-flipW / 2, -h / 2, flipW, h);
      }
      text(s.prize.icon, 0, -h * 0.14, Math.max(8, Math.min(12, game.slotW * .5)), PIX.ink);
      text(shortLabel(s.prize.label), 0, h * 0.26, Math.max(5, Math.min(7, game.slotW * .26)), PIX.ink);
    } else {
      // 背面：像素问号牌
      ctx.fillStyle = PIX.red;
      ctx.fillRect(-flipW / 2, -h / 2, flipW, h);
      ctx.fillStyle = '#b32a3d';
      for (let yy = -h / 2 + 2; yy < h / 2 - 2; yy += 4) {
        ctx.fillRect(-flipW / 2 + 2, yy, Math.max(1, flipW - 4), 1);
      }
      ctx.fillStyle = PIX.ink;
      ctx.fillRect(-flipW / 2, -h / 2, flipW, 1);
      ctx.fillRect(-flipW / 2, h / 2 - 1, flipW, 1);
      ctx.fillRect(-flipW / 2, -h / 2, 1, h);
      ctx.fillRect(flipW / 2 - 1, -h / 2, 1, h);
      text('?', 0, 1, Math.max(9, Math.min(14, game.slotW * .6)), PIX.cream);
    }
    ctx.restore();
  }
  // 格间立柱
  ctx.fillStyle = '#4d4280';
  for (let i = 1; i < game.N; i++) ctx.fillRect(Math.round(i * game.slotW) - 1, H - sh, 2, sh);

  // 拉杆
  const pv = leverPivot();
  const knob = leverKnobPos();
  ctx.strokeStyle = PIX.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pv.x, pv.y); ctx.lineTo(knob.x, knob.y); ctx.stroke();
  ctx.strokeStyle = PIX.purple; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(pv.x, pv.y); ctx.lineTo(knob.x, knob.y); ctx.stroke();
  pxCirc(pv.x, pv.y, 4, PIX.purple);
  pxCirc(knob.x, knob.y, 6, PIX.yellow);
  ctx.fillStyle = PIX.cream;
  ctx.fillRect(Math.round(knob.x) - 3, Math.round(knob.y) - 3, 2, 2);
  if (game.phase === 'ready' && Math.sin(t * 5) > -0.3) {
    text('拉!', knob.x - 4, knob.y - 12, 7, PIX.yellow);
  }

  // 火花粒子
  game.sparks.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life * 4);
    ctx.fillStyle = PIX.yellow;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  });
  ctx.globalAlpha = 1;

  // 弹珠（带渐隐尾迹）
  if (game.phase !== 'over') {
    const b = game.ball;
    game.trail.forEach((p, i) => {
      ctx.globalAlpha = (i + 1) / game.trail.length * 0.25;
      ctx.fillStyle = PIX.cream;
      pxCirc(p.x, p.y, Math.max(1.5, b.r * 0.55));
    });
    ctx.globalAlpha = 1;
    drawSprite(BALL_MAP, BALL_PAL, b.x - 4.5, b.y - 4.5);
  }

  // 未投币提示
  if (!armed && (game.phase === 'cover' || game.phase === 'ready') && Math.sin(Date.now() / 300) > -0.4) {
    text('🪙 投币开始', W / 2, H * 0.42, 9, PIX.yellow);
  }
}

/* =========================================================
 * 🦆 游戏二：打鸭子（FC 经典玩法）
 * idle → flying（点中击落）→ reveal
 * ========================================================= */
const duck = {
  phase: 'idle',           // idle | flying
  ducks: [],
  feathers: [],
  rings: [],
  flyAway: false,
  endTimer: 0,
  roundT: 0,
  aim: { x: -100, y: -100 },
};

function resetDuck() {
  duck.phase = 'idle';
  duck.ducks = [];
  duck.feathers = [];
  duck.rings = [];
  duck.flyAway = false;
  duck.endTimer = 0;
  duck.roundT = 0;
  renderHeader();
}

function releaseDucks() {
  if (!state.prizes.length) { toast('请先在后台添加奖品 🎁'); return; }
  if (duck.phase !== 'idle') return;
  if (!armed) { needCoin(); return; }
  duck.phase = 'flying';
  const deck = buildDeck();                    // 全部奖券一次入局
  const n = deck.length;
  const r = n > 8 ? 11 : 15;
  duck.ducks = deck.map((prize, i) => {
    const d0 = {
      x: Wspr(i, n),
      y: view.H - 52,
      tx: 0, ty: 0, txSet: false,
      speed: 46 + Math.random() * 34,
      r,
      prize,
      falling: false,
      fallen: false,
      born: i * 0.14,
      quacked: false,
      rot: 0,
      flap: Math.random() * 6,
      won: false,
      vx: 0, vy: -60,
    };
    newDuckTarget(d0);
    return d0;
  });
  duck.flyAway = false;
  duck.roundT = 0;
  duck.endTimer = 8 + n * 0.6;
  renderHeader();
  toast(`${n} 只鸭子各藏一张奖券，快打中一只！🦆`);
}
function Wspr(i, n) {
  // 出生点横向均匀散开
  return (i + 0.5) / n * (view.W - 40) + 20 + (Math.random() - .5) * 10;
}

/* 借鉴 DuckHunt-JS：鸭子朝随机目标点直线飞，到达后再挑下一个（保持最小飞行距离） */
function newDuckTarget(d) {
  let nx, ny, tries = 0;
  do {
    nx = 18 + Math.random() * (view.W - 36);
    ny = 52 + Math.random() * (view.H - 128);
    tries++;
  } while (tries < 8 && Math.hypot(nx - d.x, ny - d.y) < 56);
  d.tx = nx; d.ty = ny; d.txSet = true;
}

function hitDuck(d) {
  d.falling = true;
  duck.flyAway = true; // 其他鸭子飞走
  duck.endTimer = Math.min(duck.endTimer, 1.8);
  armed = false; // 一枚币一枪
  Sound.sfx.hit();
  Sound.sfx.duckFall();
  addShake(2.2, 0.22);
  addFlash(0.06); // DuckHunt-JS 的开枪白屏闪光
  showBig('砰！！', PIX.yellow);
  for (let i = 0; i < 14; i++) {
    duck.feathers.push({
      x: d.x, y: d.y,
      vx: (Math.random() - .5) * 110,
      vy: -Math.random() * 80,
      rot: Math.random() * Math.PI,
      life: 1.2 + Math.random(),
    });
  }
  duck.rings.push({ x: d.x, y: d.y, r: 5, life: 0.4 });
}

function stepDuck(dt) {
  duck.feathers = duck.feathers.filter(f => (f.life -= dt) > 0);
  for (const f of duck.feathers) {
    f.vy += 130 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 4;
  }
  duck.rings = duck.rings.filter(r => (r.life -= dt) > 0);
  for (const r of duck.rings) r.r += 110 * dt;

  if (duck.phase !== 'flying') return;

  duck.roundT += dt;
  duck.endTimer -= dt;
  if (duck.endTimer <= 0 && !duck.flyAway) {
    duck.flyAway = true;
    Sound.sfx.quack();
    showBig('飞走啦…', PIX.sky, '鸭子们溜掉了');
  }

  let allGone = true;
  for (const d of duck.ducks) {
    if (d.fallen) continue;
    if (duck.roundT < d.born) { allGone = false; continue; } // 还没出场
    if (!d.quacked) { d.quacked = true; if (Math.random() < 0.5) Sound.sfx.quack(); Sound.sfx.pop(); }
    allGone = false;
    if (d.falling) {
      d.vy += 700 * dt;
      d.y += d.vy * dt;
      d.rot += dt * 5;
      if (d.y > view.H - 40 && !d.won) {
        d.won = true;
        d.fallen = true;
        Sound.sfx.thud();
        addShake(1.5, 0.18);
        recordWin(d.prize);
        renderPrizeRows(); renderHistory();
        showWinModal(d.prize, resetDuck, 450, `击中了鸭子！它身上藏着——`);
      }
      continue;
    }
    if (duck.flyAway) {
      // 借鉴 DuckHunt-JS flyAway：成群从屏幕上方逃离
      d.tx = d.x < view.W / 2 ? -70 : view.W + 70;
      d.ty = -70;
    } else if (!d.txSet || Math.hypot(d.tx - d.x, d.ty - d.y) < 12) {
      newDuckTarget(d);
    }
    const dx = d.tx - d.x, dy = d.ty - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    d.vx = dx / dist * d.speed;
    d.vy = dy / dist * d.speed;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (duck.flyAway && (d.x < -50 || d.x > view.W + 50 || d.y < -50)) {
      d.fallen = true;
    }
  }
  if (duck.flyAway && allGone) {
    duck.phase = 'idle';
    duck.ducks = [];
    armed = false;
    renderHeader();
  }
}

function drawDuck() {
  const { W, H } = view;
  const t = Date.now() / 1000;

  // 天空（像素色带）
  ctx.fillStyle = PIX.sky;
  ctx.fillRect(0, 0, W, H - 44);
  ctx.fillStyle = PIX.sky2;
  ctx.fillRect(0, H - 84, W, 40);
  // 太阳
  pxCirc(20, 24, 9, PIX.yellow);
  ctx.fillStyle = PIX.orange;
  ctx.fillRect(18, 22, 2, 2);
  // 方块云
  ctx.fillStyle = '#fffdf4';
  const clouds = [[(t * 6) % (W + 40) - 20, 18], [(t * 4 + 70) % (W + 40) - 20, 34], [(t * 8 + 130) % (W + 40) - 20, 12]];
  for (const [x, y] of clouds) {
    ctx.fillRect(Math.round(x), y, 18, 4);
    ctx.fillRect(Math.round(x) + 4, y - 3, 10, 3);
    ctx.fillRect(Math.round(x) + 8, y + 4, 10, 3);
  }
  // 远山树丛
  ctx.fillStyle = PIX.dgreen;
  for (let x = 0; x < W; x += 22) {
    ctx.fillRect(x, H - 76, 14, 10);
    ctx.fillRect(x + 4, H - 80, 6, 4);
  }
  // 草地
  ctx.fillStyle = PIX.green;
  ctx.fillRect(0, H - 44, W, 44);
  ctx.fillStyle = PIX.dgreen;
  for (let x = 4; x < W; x += 14) ctx.fillRect(x, H - 46, 3, 3);
  ctx.fillStyle = '#3a7a34';
  ctx.fillRect(0, H - 24, W, 2);

  // 鸭子
  for (const d of duck.ducks) {
    if (d.fallen || duck.roundT < d.born) continue;
    const facing = d.vx >= 0;
    ctx.save();
    ctx.translate(Math.round(d.x), Math.round(d.y));
    if (d.falling) ctx.rotate(d.rot);
    if (d.falling && IMGS.duckHit) {
      drawImgCentered(IMGS.duckHit, 0, 0, d.r * 2.4, !facing);
    } else {
      const flap = Math.sin(t * 10 + d.flap) > 0;
      const img = IMGS[flap ? 'duckFly1' : 'duckFly2'];
      if (img) drawImgCentered(img, 0, 0, d.r * 2.4, !facing);
      else {
        const sc = d.r / 14;
        ctx.scale(facing ? sc : -sc, sc);
        drawSprite(flap ? DUCK_A : DUCK_B, DUCK_PAL, -7, -5);
      }
    }
    ctx.restore();
  }

  // 羽毛
  for (const f of duck.feathers) {
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#fffdf4';
    ctx.fillRect(-2, -1, 4, 2);
    ctx.restore();
  }
  // 命中波纹
  for (const r of duck.rings) {
    ctx.save();
    ctx.globalAlpha = r.life * 2;
    ctx.strokeStyle = PIX.red; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 准星
  if (duck.phase === 'flying' && duck.aim.x > 0) {
    const { x, y } = duck.aim;
    ctx.save();
    ctx.globalAlpha = .85;
    ctx.strokeStyle = PIX.red; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = PIX.red;
    ctx.fillRect(x - 1, y - 1, 2, 2);
    ctx.beginPath();
    ctx.moveTo(x - 11, y); ctx.lineTo(x - 5, y);
    ctx.moveTo(x + 5, y); ctx.lineTo(x + 11, y);
    ctx.moveTo(x, y - 11); ctx.lineTo(x, y - 5);
    ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 11);
    ctx.stroke();
    ctx.restore();
  }
  // 空闲提示
  if (duck.phase === 'idle') {
    if (!armed) {
      text('🪙 投币放鸭子', W / 2, H / 2 - 14, 9, PIX.ink);
    } else {
      text('点下方「放鸭子」！', W / 2, H / 2 - 14, 8, PIX.ink);
    }
    text('🦆', W / 2, H / 2 + 16, 16, PIX.ink);
  }
}

/* =========================================================
 * 🎣 游戏三：钓鱼
 * idle（钩子摆动）→ dropping → reeling → reveal / idle
 * ========================================================= */
const fishG = {
  phase: 'idle',       // idle | dropping | reeling | busy
  t: 0,
  hookX: 0, hookY: 46,
  fishes: [],
  carry: null,
  bubbles: [],
  ripples: [],
  splashPs: [],        // 甩竿/咬钩水花粒子
  sndT: 0,
};

function splashAt(x, y, n = 8) {
  for (let i = 0; i < n; i++) {
    fishG.splashPs.push({
      x: x + (Math.random() - .5) * 8,
      y,
      vx: (Math.random() - .5) * 70,
      vy: -40 - Math.random() * 70,
      life: .5 + Math.random() * .3,
    });
  }
}

const FISH_COLORS = ['#f9844a', '#4d9de0', '#9b5de5', '#ffd23f', '#59c135', '#f15bb5'];

function resetFish() {
  fishG.phase = 'idle';
  fishG.t = 0;
  fishG.carry = null;
  fishG.ripples = [];
  fishG.splashPs = [];
  fishG.fishes = [];
  const deck = buildDeck();                    // 每条鱼一张奖券
  const n = deck.length;
  const surf = view.H * 0.32;
  for (let i = 0; i < n; i++) {
    const band = i % 3;
    const dir = Math.random() < .5 ? -1 : 1;
    fishG.fishes.push({
      x: 16 + Math.random() * (view.W - 32),
      y: surf + 18 + band * ((view.H - surf - 66) / 2) + Math.random() * 6,
      vx: dir * (11 + Math.random() * 17),
      size: 8,          // 所有鱼一样大，奖券纯随机藏
      imgKey: 'fishM',
      prize: deck[i],
      caught: false,
      wob: Math.random() * 6,
    });
  }
  fishG.hookX = view.W / 2;
  fishG.hookY = 40;
  renderHeader();
}

/* 中奖后不重新布池：钓走的鱼离场，其余鱼保持原位和奖券不变；
   钓空后才换一批新鱼 */
function nextRoundFish() {
  fishG.fishes = fishG.fishes.filter(f => !f.caught);
  if (!fishG.fishes.length) { resetFish(); return; }
  fishG.phase = 'idle';
  fishG.carry = null;
  fishG.hookY = 40;
  renderHeader();
}

function castLine() {
  if (!state.prizes.length) { toast('请先在后台添加奖品 🎁'); return; }
  if (fishG.phase !== 'idle') return;
  if (!armed) { needCoin(); return; }
  armed = false; // 一枚币一竿
  fishG.phase = 'dropping';
  fishG.hookY = 46;
  fishG.ripples.push({ x: fishG.hookX, y: view.H * 0.32, r: 3, life: .8 });
  splashAt(fishG.hookX, view.H * 0.32, 10);
  Sound.sfx.cast();
  Sound.sfx.splash();
  renderHeader();
}

function stepFish(dt) {
  fishG.t += dt;
  const surf = view.H * 0.32;

  fishG.splashPs = fishG.splashPs.filter(p => (p.life -= dt) > 0 && p.y < view.H + 10);
  for (const p of fishG.splashPs) { p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }

  fishG.bubbles = fishG.bubbles.filter(b => (b.life -= dt) > 0 && b.y > surf);
  for (const b of fishG.bubbles) { b.y -= 16 * dt; b.x += Math.sin(fishG.t * 3 + b.w) * 6 * dt; }
  if (Math.random() < dt * 1) {
    fishG.bubbles.push({ x: Math.random() * view.W, y: view.H - 16, r: 1 + Math.random() * 2, life: 3.5, w: Math.random() * 6 });
  }
  fishG.ripples = fishG.ripples.filter(r => (r.life -= dt) > 0);
  for (const r of fishG.ripples) r.r += 34 * dt;

  for (const f of fishG.fishes) {
    if (f.caught) continue;
    f.x += f.vx * dt;
    if (f.x < 10) { f.x = 10; f.vx = Math.abs(f.vx); }
    if (f.x > view.W - 10) { f.x = view.W - 10; f.vx = -Math.abs(f.vx); }
  }

  if (fishG.phase === 'idle') {
    fishG.hookX = view.W / 2 + Math.sin(fishG.t * 1.5) * (view.W * 0.3);
    return;
  }
  if (fishG.phase === 'dropping') {
    fishG.hookY += 165 * dt;
    for (const f of fishG.fishes) {
      if (f.caught) continue;
      if (Math.hypot(fishG.hookX - f.x, fishG.hookY - f.y) < f.size + 5) {
        f.caught = true;
        fishG.carry = f;
        fishG.phase = 'reeling';
        fishG.sndT = 0;
        Sound.sfx.bite();
        splashAt(f.x, surf + 2, 8);
        showBig('咬钩了！', PIX.yellow, '快收线！');
        for (let i = 0; i < 6; i++) {
          fishG.ripples.push({ x: f.x, y: f.y, r: 2, life: .6 });
        }
        return;
      }
    }
    if (fishG.hookY > view.H - 26) {
      fishG.hookY = view.H - 26;
      fishG.phase = 'reeling';
    }
    return;
  }
  if (fishG.phase === 'reeling') {
    fishG.hookY -= 195 * dt;
    fishG.sndT += dt;
    if (fishG.sndT > 0.1) { fishG.sndT = 0; Sound.sfx.reel(); }
    if (fishG.carry) {
      fishG.carry.x = fishG.hookX;
      fishG.carry.y = fishG.hookY + 4;
    }
    if (fishG.hookY <= 44) {
      const got = fishG.carry;
      fishG.carry = null;
      if (got) {
        fishG.phase = 'busy';
        Sound.sfx.splash();
        splashAt(fishG.hookX, surf + 2, 12);
        addShake(1.5, 0.18);
        showBig('中鱼啦！！', PIX.yellow);
        recordWin(got.prize);
        renderPrizeRows(); renderHistory();
        showWinModal(got.prize, nextRoundFish, 500, `钓上来一条鱼！鱼肚子里是——`);
      } else {
        fishG.phase = 'idle';
        Sound.sfx.lose();
        toast('什么都没钓到，换个时机再甩竿！');
        renderHeader();
      }
    }
    return;
  }
}

function drawFish() {
  const { W, H } = view;
  const surf = H * 0.32;

  // 天空
  ctx.fillStyle = PIX.sky;
  ctx.fillRect(0, 0, W, surf);
  // 像素小船
  ctx.fillStyle = PIX.wood;
  ctx.fillRect(6, 14, 24, 6);
  ctx.fillRect(10, 10, 16, 4);
  ctx.fillStyle = PIX.ink;
  ctx.fillRect(6, 19, 24, 1);
  ctx.fillStyle = PIX.paper;
  ctx.fillRect(14, 2, 2, 9); // 桅杆
  ctx.fillStyle = PIX.red;
  ctx.fillRect(16, 3, 7, 5); // 小旗
  // 太阳
  pxCirc(W - 52, 15, 7, PIX.yellow);

  // 水
  ctx.fillStyle = PIX.water;
  ctx.fillRect(0, surf, W, H - surf);
  // 水下光柱（随时间缓慢摆动）
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#d8f0ff';
  for (const rx of [30, 78, 130]) {
    const sway = Math.sin(fishG.t * 0.7 + rx) * 6;
    ctx.beginPath();
    ctx.moveTo(rx, surf);
    ctx.lineTo(rx + 16, surf);
    ctx.lineTo(rx + 30 + sway, H - 20);
    ctx.lineTo(rx + 2 + sway, H - 20);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = PIX.deep;
  ctx.fillRect(0, H - 30, W, 30);
  // 像素波浪线
  ctx.fillStyle = '#7cc4ee';
  for (let x = 0; x < W; x += 8) {
    const y = surf + Math.round(Math.sin(x / 14 + fishG.t * 2.2) * 1.5);
    ctx.fillRect(x, y, 4, 1);
  }
  // 沙地
  ctx.fillStyle = PIX.sand;
  ctx.fillRect(0, H - 12, W, 12);
  ctx.fillStyle = '#d4a94e';
  for (let x = 4; x < W; x += 16) ctx.fillRect(x, H - 10, 3, 2);

  // 水草
  ctx.fillStyle = PIX.dgreen;
  for (const sx of [14, W - 18, 34, W - 40]) {
    const sway = Math.round(Math.sin(fishG.t * 1.6 + sx) * 2);
    for (let k = 0; k < 4; k++) {
      ctx.fillRect(sx + sway + (k % 2), H - 16 - k * 4, 2, 4);
    }
  }
  // 水花粒子
  for (const p of fishG.splashPs) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life * 2.5);
    ctx.fillStyle = '#d8f0ff';
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    ctx.restore();
  }
  // 气泡
  for (const b of fishG.bubbles) {
    ctx.save();
    ctx.globalAlpha = Math.min(.7, b.life);
    ctx.strokeStyle = '#d8f0ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 波纹
  for (const r of fishG.ripples) {
    ctx.save();
    ctx.globalAlpha = r.life;
    ctx.strokeStyle = '#d8f0ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, Math.max(1, r.r * .4), 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 鱼
  fishG.fishes.forEach((f, i) => {
    if (f.caught && fishG.carry !== f) return;
    const carried = fishG.carry === f;
    const wob = Math.sin(fishG.t * 4 + f.wob) * 1.2;
    ctx.save();
    ctx.translate(Math.round(f.x), Math.round(f.y + (carried ? 0 : wob * .4)));
    if (carried) ctx.rotate(Math.sin(fishG.t * 12) * .22);
    const key = carried ? f.imgKey + 'Dead' : f.imgKey;
    const img = IMGS[key] || IMGS[f.imgKey];
    if (img) {
      // 素材鱼头朝左：向右游时翻转
      drawImgCentered(img, 0, 0, f.size * 2.3, f.vx > 0);
    } else {
      const dir = f.vx >= 0;
      const sc = f.size / 6.5;
      ctx.scale(dir ? sc : -sc, sc);
      drawSprite(FISH_MAP, fishPalette(FISH_COLORS[i % FISH_COLORS.length]), -6.5, -3.5);
    }
    ctx.restore();
  });

  // 鱼线（从桅杆到钩）
  ctx.strokeStyle = 'rgba(32,34,58,.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(15, 6);
  const midX = (15 + fishG.hookX) / 2;
  ctx.quadraticCurveTo(midX, Math.max(10, fishG.hookY * .4), fishG.hookX, fishG.hookY - 6);
  ctx.stroke();
  // 浮漂（像素）
  ctx.fillStyle = PIX.red;
  ctx.fillRect(Math.round(fishG.hookX) - 2, Math.round(fishG.hookY) - 9, 4, 4);
  ctx.fillStyle = PIX.paper;
  ctx.fillRect(Math.round(fishG.hookX) - 2, Math.round(fishG.hookY) - 8, 4, 1);
  // 钩
  ctx.strokeStyle = PIX.ink; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(fishG.hookX, fishG.hookY, 3, -Math.PI * .1, Math.PI * 1.1);
  ctx.stroke();

  // 提示
  if (fishG.phase === 'idle') {
    if (!armed) text('🪙 投币后甩竿！', W / 2, surf + 13, 8, '#eaf6ff');
    else text('等钩子摆到鱼上方，点「甩竿」！', W / 2, surf + 13, 7, '#eaf6ff');
  }
}

/* =========================================================
 * ⚽ 游戏四：足球射门（瞄准条往返移动，点屏幕起脚，躲开守门员）
 * ========================================================= */
const soccerG = {
  phase: 'idle',
  aim: 96, dir: 1, ball: null, keeper: -1,
  keeperX: 96, keeperDive: -1, keeperRest: 0,
  kickPs: [],
  prizes: [], timer: 0,
};
const GOAL = { x0: 36, x1: 156, y: 54, slots: 5 };

function resetSoccer() {
  const deck = buildDeck();
  soccerG.prizes = [];
  for (let i = 0; i < GOAL.slots; i++) {
    soccerG.prizes.push(deck[Math.floor(Math.random() * deck.length)]);
  }
  soccerG.phase = 'idle';
  soccerG.aim = 96; soccerG.dir = 1; soccerG.ball = null; soccerG.keeper = -1;
  soccerG.keeperX = 96; soccerG.keeperDive = -1; soccerG.keeperRest = 0;
  soccerG.kickPs = [];
  soccerG.timer = 12;
  renderHeader();
}

function startSoccer() {
  if (!state.prizes.length) { toast('请先在后台添加奖品 🎁'); return; }
  if (soccerG.phase !== 'idle') return;
  if (!armed) { needCoin(); return; }
  armed = false;
  soccerG.phase = 'play';
  soccerG.timer = 12;
  soccerG.keeperRest = 0;
  Sound.sfx.click();
  renderHeader();
}

function kickSoccer() {
  if (soccerG.phase !== 'play' || soccerG.ball) return;
  soccerG.keeper = Math.floor(Math.random() * GOAL.slots);
  const slotW = (GOAL.x1 - GOAL.x0) / GOAL.slots;
  soccerG.keeperDive = GOAL.x0 + slotW * (soccerG.keeper + 0.5); // 扑救目标位置
  soccerG.ball = { sx: 96, sy: 246, tx: soccerG.aim, t: 0 };
  // 踢起草皮粒子
  for (let i = 0; i < 10; i++) {
    soccerG.kickPs.push({
      x: 96 + (Math.random() - .5) * 6, y: 248,
      vx: (Math.random() - .5) * 80,
      vy: -30 - Math.random() * 60,
      life: .4 + Math.random() * .3,
    });
  }
  Sound.sfx.launch();
  renderHeader();
}

function stepSoccer(dt) {
  // 草皮粒子
  soccerG.kickPs = soccerG.kickPs.filter(p => (p.life -= dt) > 0);
  for (const p of soccerG.kickPs) { p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  // 守门员回中
  if (soccerG.keeperRest > 0) {
    soccerG.keeperRest -= dt;
    soccerG.keeperX += (96 - soccerG.keeperX) * Math.min(1, dt * 6);
  }
  if (soccerG.phase !== 'play') return;
  if (soccerG.ball) {
    soccerG.ball.t += dt / 0.5;
    // 守门员朝预判位置飞身扑救
    if (soccerG.keeperDive >= 0) {
      const kd = soccerG.keeperDive - soccerG.keeperX;
      soccerG.keeperX += Math.sign(kd) * Math.min(Math.abs(kd), 260 * dt);
    }
    if (soccerG.ball.t >= 1) {
      const slotW = (GOAL.x1 - GOAL.x0) / GOAL.slots;
      const slot = Math.max(0, Math.min(GOAL.slots - 1, Math.floor((soccerG.ball.tx - GOAL.x0) / slotW)));
      const prize = soccerG.prizes[slot];
      soccerG.ball = null;
      soccerG.keeperDive = -1;
      soccerG.keeperRest = 1.2;
      if (slot === soccerG.keeper) {
        soccerG.phase = 'idle';
        Sound.sfx.lose();
        addShake(1.5, 0.2);
        showBig('被扑出！', PIX.sky, '守门员神勇扑救');
        toast('被守门员扑出来了！再投币试试 🧤');
        renderHeader();
      } else {
        soccerG.phase = 'done';
        addShake(2.5, 0.3);
        showBig('GOAL！！', PIX.yellow, '球进啦');
        recordWin(prize);
        renderPrizeRows(); renderHistory();
        showWinModal(prize, resetSoccer, 450, '一脚命中！球滚到了——');
      }
    }
    return;
  }
  // 守门员开球前左右巡逻干扰
  soccerG.keeperX = 96 + Math.sin(performance.now() / 1000 * 2.1) * slotW2() * 1.7;
  soccerG.aim += soccerG.dir * 95 * dt;
  if (soccerG.aim > GOAL.x1 - 4) { soccerG.aim = GOAL.x1 - 4; soccerG.dir = -1; }
  if (soccerG.aim < GOAL.x0 + 4) { soccerG.aim = GOAL.x0 + 4; soccerG.dir = 1; }
  soccerG.timer -= dt;
  if (soccerG.timer <= 0) {
    soccerG.phase = 'idle'; armed = false;
    Sound.sfx.lose();
    toast('时间到！再投币试试 ⏰');
    renderHeader();
  }
}
function slotW2() { return (GOAL.x1 - GOAL.x0) / GOAL.slots; }

function drawSoccer() {
  const { W, H } = view;
  // 天空和草地
  ctx.fillStyle = PIX.sky2; ctx.fillRect(0, 0, W, H * 0.5);
  ctx.fillStyle = PIX.green; ctx.fillRect(0, H * 0.5, W, H * 0.5);
  ctx.fillStyle = PIX.dgreen;
  for (let i = 0; i < 6; i++) ctx.fillRect(0, H * 0.5 + i * 15, W, 7);
  const gw = GOAL.x1 - GOAL.x0, slotW = gw / GOAL.slots;
  // 网
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillRect(GOAL.x0, GOAL.y, gw, 42);
  ctx.fillStyle = 'rgba(32,34,58,.28)';
  for (let x = GOAL.x0; x <= GOAL.x1; x += 6) ctx.fillRect(x, GOAL.y, 1, 42);
  for (let y = GOAL.y; y <= GOAL.y + 42; y += 6) ctx.fillRect(GOAL.x0, y, gw, 1);
  // 门柱
  ctx.fillStyle = PIX.cream;
  ctx.fillRect(GOAL.x0 - 3, GOAL.y - 3, 3, 48);
  ctx.fillRect(GOAL.x1, GOAL.y - 3, 3, 48);
  ctx.fillRect(GOAL.x0 - 3, GOAL.y - 3, gw + 6, 3);
  // 每格盖着的奖券（不展示内容，射进哪格随机揭晓）
  soccerG.prizes.forEach((p, i) => {
    const x = GOAL.x0 + slotW * (i + 0.5);
    ctx.fillStyle = PIX.ink; ctx.fillRect(x - 10, GOAL.y + 7, 20, 23);
    ctx.fillStyle = PIX.blue; ctx.fillRect(x - 9, GOAL.y + 8, 18, 21);
    text('?', x, GOAL.y + 19, 11, PIX.cream);
  });
  // 草皮粒子（开脚踢起的草屑）
  soccerG.kickPs.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.2));
    ctx.fillStyle = p.color || PIX.dgreen;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  });
  ctx.globalAlpha = 1;
  // 守门员（开脚后扑向预判格，扑救时身体伸展倾斜）
  const kx = soccerG.keeperX;
  const ky = GOAL.y + 36;
  const diving = soccerG.keeperDive >= 0;
  const lean = diving ? Math.max(-0.5, Math.min(0.5, (soccerG.keeperDive - kx) / 40)) : 0;
  ctx.save();
  ctx.translate(kx, ky - 12);
  ctx.rotate(lean);
  ctx.fillStyle = PIX.pink; ctx.fillRect(-4, -6, 8, 9);          // 身体
  ctx.fillStyle = '#f1c27d'; pxCirc(0, -10, 3.5);                // 头
  ctx.fillStyle = PIX.ink;
  ctx.fillRect(-6, 3, 4, 7); ctx.fillRect(2, 3, 4, 7);           // 腿
  ctx.fillStyle = '#f1c27d';
  if (diving) { ctx.fillRect(-11, -8, 7, 3); ctx.fillRect(4, -8, 7, 3); } // 扑救：双臂张开
  else { ctx.fillRect(-8, -5, 3, 6); ctx.fillRect(5, -5, 3, 6); }         // 站立
  ctx.restore();
  // 瞄准标
  if (soccerG.phase === 'play' && !soccerG.ball) {
    const ax = soccerG.aim;
    ctx.fillStyle = PIX.yellow;
    ctx.beginPath(); ctx.moveTo(ax - 5, GOAL.y + 54); ctx.lineTo(ax + 5, GOAL.y + 54); ctx.lineTo(ax, GOAL.y + 45); ctx.closePath(); ctx.fill();
    ctx.fillRect(ax - 1, GOAL.y + 45, 2, 40);
  }
  // 球（飞行 or 点球点）
  if (soccerG.ball) {
    const b = soccerG.ball, t = Math.min(1, b.t);
    const bx = b.sx + (b.tx - b.sx) * t;
    const by = b.sy + (66 - b.sy) * t - Math.sin(Math.PI * t) * 46;
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    pxCirc(b.sx + (b.tx - b.sx) * t, 252, Math.max(2, 6 * (1 - t * 0.6)));
    ctx.fillStyle = PIX.cream; pxCirc(bx, by, 5);
    ctx.fillStyle = PIX.ink;
    ctx.fillRect(bx - 1, by - 4, 2, 2); ctx.fillRect(bx - 3, by + 1, 2, 2); ctx.fillRect(bx + 2, by + 1, 2, 2);
  } else {
    ctx.fillStyle = PIX.cream; pxCirc(96, 246, 5);
    ctx.fillStyle = PIX.ink;
    ctx.fillRect(95, 242, 2, 2); ctx.fillRect(93, 247, 2, 2); ctx.fillRect(97, 247, 2, 2);
    // 罚球的小人
    ctx.fillStyle = PIX.blue; ctx.fillRect(116, 234, 8, 10);
    ctx.fillStyle = '#f1c27d'; pxCirc(120, 230, 3.5);
    ctx.fillStyle = PIX.ink;
    ctx.fillRect(116, 244, 3, 7); ctx.fillRect(121, 244, 3, 7);
  }
  // 提示
  if (soccerG.phase === 'idle') {
    if (!armed) text('🪙 投币踢点球', W / 2, H * 0.45, 9, PIX.ink);
    else text('点「⚽ 开始」踢点球！', W / 2, H * 0.45, 8, PIX.ink);
  } else if (soccerG.phase === 'play' && !soccerG.ball) {
    text('瞄准空档，点屏幕射门！', W / 2, H * 0.45, 8, PIX.ink);
  }
}

/* =========================================================
 * 🏹 游戏五：弓箭（准星随风摆动，点屏幕放箭，奖品随机掉落）
 * ========================================================= */
const archG = {
  phase: 'idle',
  t: 0, arrow: null, timer: 0,
  cx: 132, cy: 112, R: 44,
  hits: [],
};
const RING_W = 8.8;

function resetArch() {
  archG.phase = 'idle';
  archG.t = 0; archG.arrow = null; archG.timer = 12;
  archG.hits = [];
  renderHeader();
}

function startArch() {
  if (!state.prizes.length) { toast('请先在后台添加奖品 🎁'); return; }
  if (archG.phase !== 'idle') return;
  if (!armed) { needCoin(); return; }
  armed = false;
  archG.phase = 'play';
  archG.t = 0; archG.arrow = null; archG.timer = 12;
  Sound.sfx.click();
  renderHeader();
}

function archAim() {
  return {
    x: archG.cx + Math.sin(archG.t * 1.35) * 24 + Math.sin(archG.t * 3.1) * 5,
    y: archG.cy + Math.cos(archG.t * 0.95) * 20,
  };
}

function releaseArch() {
  if (archG.phase !== 'play' || archG.arrow) return;
  const a = archAim();
  archG.arrow = { sx: 16, sy: 252, tx: a.x, ty: a.y, t: 0 };
  Sound.sfx.ratchet();
  renderHeader();
}

function stepArch(dt) {
  if (archG.phase !== 'play') return;
  archG.t += dt;
  if (archG.arrow) {
    archG.arrow.t += dt / 0.35;
    if (archG.arrow.t >= 1) {
      const noise = () => (Math.random() * 2 - 1) * 2.5;
      const hx = archG.arrow.tx + noise(), hy = archG.arrow.ty + noise();
      const dist = Math.hypot(hx - archG.cx, hy - archG.cy);
      const k = Math.max(0, Math.min(4, Math.floor((archG.R - dist) / RING_W)));
      const deck = buildDeck();
      const prize = deck[Math.floor(Math.random() * deck.length)];
      archG.hits.push({ x: hx, y: hy });
      archG.phase = 'done';
      addShake(k === 4 ? 2.5 : 1.2, 0.18);
      showBig(k === 4 ? '靶心！！' : '命中！', k === 4 ? PIX.yellow : PIX.cream,
        k === 4 ? '一箭穿心，太厉害了' : `${['外环', '四环', '三环', '二环', '靶心'][k]}命中`);
      Sound.sfx.thud();
      recordWin(prize);
      renderPrizeRows(); renderHistory();
      showWinModal(prize, resetArch, 450, `${['外环', '四环', '三环', '二环', '靶心'][k]}命中！随机战利品是——`);
    }
    return;
  }
  archG.timer -= dt;
  if (archG.timer <= 0) {
    archG.phase = 'idle'; armed = false;
    Sound.sfx.lose();
    toast('时间到！再投币试试 ⏰');
    renderHeader();
  }
}

function drawArch() {
  const { W, H } = view;
  // 天空和草地
  ctx.fillStyle = PIX.sky2; ctx.fillRect(0, 0, W, H * 0.72);
  ctx.fillStyle = PIX.green; ctx.fillRect(0, H * 0.72, W, H * 0.28);
  ctx.fillStyle = PIX.dgreen; ctx.fillRect(0, H * 0.72, W, 4);
  // 靶架
  ctx.fillStyle = PIX.wood; ctx.fillRect(archG.cx - 3, archG.cy + archG.R - 4, 6, H * 0.72 - archG.cy - archG.R + 8);
  // 靶面五环（外→内：白、黑、蓝、红、金）——奖品不展示，射中即随机掉落
  const ringColors = ['#f2f2f2', PIX.ink, PIX.blue, PIX.red, PIX.yellow];
  for (let k = 0; k < 5; k++) {
    ctx.fillStyle = ringColors[k];
    pxCirc(archG.cx, archG.cy, archG.R - k * RING_W);
  }
  for (let k = 0; k < 5; k++) {
    text(['外', '四', '三', '二', '心'][k], archG.cx, archG.cy + archG.R - k * RING_W - RING_W / 2, 4, k === 1 ? PIX.cream : PIX.ink);
  }
  // 靶顶飘动的小旗
  ctx.fillStyle = PIX.ink; ctx.fillRect(archG.cx, archG.cy - archG.R - 16, 1.5, 16);
  const flagW = 10 + Math.sin(archG.t * 5) * 1.5;
  const flagY = archG.cy - archG.R - 15 + Math.sin(archG.t * 3) * 1;
  ctx.fillStyle = PIX.red;
  ctx.beginPath(); ctx.moveTo(archG.cx + 1.5, flagY); ctx.lineTo(archG.cx + 1.5 + flagW, flagY + 3); ctx.lineTo(archG.cx + 1.5, flagY + 6); ctx.closePath(); ctx.fill();
  // 插在靶上的箭（命中留念）
  archG.hits.forEach(h => {
    const ang = Math.atan2(h.y - 252, h.x - 16);
    ctx.save();
    ctx.translate(h.x, h.y); ctx.rotate(ang);
    ctx.fillStyle = PIX.wood; ctx.fillRect(0, -1, 14, 2);
    ctx.fillStyle = PIX.red; ctx.fillRect(12, -3, 4, 2); ctx.fillRect(12, 1, 4, 2);
    ctx.restore();
  });
  // 弓
  ctx.strokeStyle = PIX.wood; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(16, 252, 14, -Math.PI / 2.4, Math.PI / 2.4); ctx.stroke();
  // 准星
  if (archG.phase === 'play' && !archG.arrow) {
    const a = archAim();
    ctx.strokeStyle = PIX.yellow; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(a.x, a.y, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = PIX.yellow;
    ctx.fillRect(a.x - 1, a.y - 1, 2, 2);
    ctx.fillRect(a.x - 9, a.y, 4, 1); ctx.fillRect(a.x + 5, a.y, 4, 1);
    ctx.fillRect(a.x, a.y - 9, 1, 4); ctx.fillRect(a.x, a.y + 5, 1, 4);
  }
  // 箭
  if (archG.arrow) {
    const ar = archG.arrow, t = Math.min(1, ar.t);
    const hx = ar.sx + (ar.tx - ar.sx) * t;
    const hy = ar.sy + (ar.ty - ar.sy) * t;
    const ang = Math.atan2(ar.ty - ar.sy, ar.tx - ar.sx);
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.fillStyle = PIX.wood; ctx.fillRect(-14, -1, 20, 2);
    ctx.fillStyle = PIX.ink; ctx.beginPath(); ctx.moveTo(6, -2.5); ctx.lineTo(10, 0); ctx.lineTo(6, 2.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PIX.red; ctx.fillRect(-14, -3, 4, 2); ctx.fillRect(-14, 1, 4, 2);
    ctx.restore();
  } else if (archG.phase === 'play') {
    // 搭在弓上的箭
    ctx.fillStyle = PIX.wood; ctx.fillRect(16, 251, 22, 2);
    ctx.fillStyle = PIX.ink; ctx.beginPath(); ctx.moveTo(38, 249.5); ctx.lineTo(42, 252); ctx.lineTo(38, 254.5); ctx.closePath(); ctx.fill();
  }
  // 提示
  if (archG.phase === 'idle') {
    if (!armed) text('🪙 投币射箭', W / 2, H * 0.85, 9, PIX.ink);
    else text('点「🏹 开始」拉弓！', W / 2, H * 0.85, 8, PIX.ink);
  } else if (archG.phase === 'play' && !archG.arrow) {
    text('稳住呼吸，点屏幕放箭！', W / 2, H * 0.85, 8, PIX.ink);
  }
}

/* =========================================================
 * 🎮 全局游戏手感：震屏 / 白屏闪光 / 大字反馈（借鉴 DuckHunt-JS 等开源实现）
 * ========================================================= */
let shakeV = 0, shakeM = 0;   // 震屏剩余时间 / 震幅
let flashV = 0;               // 白屏闪光剩余时间
let bigFeed = null;           // 大字反馈 {str, sub, t, color}

function addShake(mag, dur) { shakeM = Math.max(shakeM, mag); shakeV = Math.max(shakeV, dur); }
function addFlash(dur) { flashV = Math.max(flashV, dur); }
function showBig(str, color = PIX.yellow, sub = '') { bigFeed = { str, sub, t: 0, color }; }
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

function stepFeel(dt) {
  if (shakeV > 0) shakeV -= dt;
  if (flashV > 0) flashV -= dt;
  if (bigFeed) { bigFeed.t += dt; if (bigFeed.t > 1.5) bigFeed = null; }
}

function drawFeel() {
  if (flashV > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, flashV / 0.05) * 0.85;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -8, view.W + 16, view.H + 16);
    ctx.restore();
  }
  if (!bigFeed) return;
  const k = bigFeed.t < 0.26 ? easeOutBack(bigFeed.t / 0.26) : 1;
  const alpha = bigFeed.t > 1.05 ? Math.max(0, 1 - (bigFeed.t - 1.05) / 0.45) : 1;
  const bounce = bigFeed.t > 1.05 ? Math.sin((bigFeed.t - 1.05) * 30) * 1.5 : 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(view.W / 2, view.H * 0.38 + bounce);
  ctx.scale(k, k);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = pxFont(20, 900);
  ctx.lineWidth = 5; ctx.strokeStyle = PIX.ink; ctx.lineJoin = 'round';
  ctx.strokeText(bigFeed.str, 0, 0);
  ctx.fillStyle = bigFeed.color;
  ctx.fillText(bigFeed.str, 0, 0);
  if (bigFeed.sub) {
    ctx.font = pxFont(8, 700);
    ctx.lineWidth = 3;
    ctx.strokeText(bigFeed.sub, 0, 17);
    ctx.fillStyle = PIX.cream;
    ctx.fillText(bigFeed.sub, 0, 17);
  }
  ctx.restore();
}

/* =========================================================
 * 🪙 投币机制：每局前必须投币；投币后随机三选一自动开局
 * ========================================================= */
const coinFx = { active: false, t: 0, dealt: false };
let armed = false; // 本局已投币（每玩一次都需要投币）

function insertCoin() {
  if (!state.prizes.length) { toast('请先在后台添加奖品 🎁'); return; }
  if (coinFx.active) return;
  Sound.sfx.coin();
  state.coins = (state.coins || 0) + 1;
  save();
  coinFx.active = true; coinFx.t = 0; coinFx.dealt = false;
  renderHeader();
}

function needCoin() {
  toast('先投币哦 🪙');
  Sound.sfx.lose();
}

function stepCoinFx(dt) {
  if (!coinFx.active) return;
  coinFx.t += dt;
  if (!coinFx.dealt && coinFx.t > 0.55) {
    coinFx.dealt = true;
    // 随机八选一，自动切换并开局
    const pick = GAME_ORDER[Math.floor(Math.random() * GAME_ORDER.length)];
    switchGame(pick); // 会先把 armed 置为 false
    armed = true;     // 必须先授权，再开局（各游戏内部有 armed 闸门）
    GAME_IMPL[pick].coinStart();
    toast(`🪙 投币成功！本轮玩「${GAME_NAMES[pick].replace(/^[^\s]+\s/, '')}」`);
    renderHeader();
  }
  if (coinFx.t > 1.1) coinFx.active = false;
}

/* 右上角像素投币口（点击这里也可以投币） */
function drawCoinSlot() {
  const x = view.W - 22, y = 3;
  ctx.fillStyle = PIX.ink;
  ctx.fillRect(x, y, 18, 11);
  ctx.fillStyle = '#4d4280';
  ctx.fillRect(x + 2, y + 2, 14, 7);
  ctx.fillStyle = PIX.yellow;
  ctx.fillRect(x + 5, y + 4, 8, 3);
  ctx.fillStyle = PIX.ink;
  ctx.fillRect(x + 7, y + 4, 4, 3);
  if (Math.sin(Date.now() / 280) > 0) {
    text('COIN', x + 9, y + 17, 5, PIX.yellow);
  }
}

function drawCoinAnim() {
  const k = Math.min(1, coinFx.t / 0.55);
  const sx = view.W / 2, sy = -8;
  const tx = view.W - 13, ty = 8;
  const x = sx + (tx - sx) * k;
  const y = sy + (ty - sy) * (k * k);
  const r = 4.5 - k * 2.5;
  pxCirc(x, y, Math.max(1.5, r), PIX.yellow);
  pxCirc(x, y, Math.max(1, r - 1.2), '#e9b90f');
  if (coinFx.t > 0.55 && Math.sin(coinFx.t * 40) > 0) {
    ctx.fillStyle = PIX.cream;
    ctx.fillRect(view.W - 14, 2, 2, 2);
    ctx.fillRect(view.W - 9, 0, 2, 2);
  }
}

function inCoinSlot(x, y) { return x > view.W - 30 && y < 24; }


/* 五款游戏注册表：reset/step/draw 由 loop 调度；play 是主按钮；coinStart 是投币后自动开局 */
const GAME_IMPL = {
  pinball: { reset: setupBoard, step: stepPinball, draw: drawPinball,
    play: () => { game.phase === 'cover' ? (armed ? shuffle() : needCoin()) : pull(); },
    coinStart: () => { setupBoard(); shuffle(); } },
  duck: { reset: resetDuck, step: stepDuck, draw: drawDuck, play: releaseDucks,
    coinStart: () => { resetDuck(); releaseDucks(); } },
  fish: { reset: resetFish, step: stepFish, draw: drawFish, play: castLine,
    coinStart: () => { resetFish(); } },
  soccer: { reset: resetSoccer, step: stepSoccer, draw: drawSoccer, play: startSoccer,
    coinStart: () => { resetSoccer(); startSoccer(); } },
  archery: { reset: resetArch, step: stepArch, draw: drawArch, play: startArch,
    coinStart: () => { resetArch(); startArch(); } },
};

let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  stepCoinFx(dt);
  stepFeel(dt);
  GAME_IMPL[active].step(dt);

  ctx.clearRect(0, 0, view.W, view.H);
  ctx.save();
  if (shakeV > 0) {
    const k = Math.min(1, shakeV * 5);
    ctx.translate((Math.random() * 2 - 1) * shakeM * k, (Math.random() * 2 - 1) * shakeM * k);
  }
  GAME_IMPL[active].draw();
  drawCoinSlot();
  if (coinFx.active) drawCoinAnim();
  ctx.restore();
  drawFeel();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * view.W;
  const y = (e.clientY - rect.top) / rect.height * view.H;
  if (inCoinSlot(x, y)) { insertCoin(); return; }
  if (active === 'soccer') { kickSoccer(); return; }
  if (active === 'archery') { releaseArch(); return; }
  if (active === 'pinball') {
    const k = leverKnobPos();
    if (Math.hypot(x - k.x, y - k.y) < 26) pull();
  } else if (active === 'duck') {
    if (duck.phase !== 'flying') return;
    if (duck.ducks.some(d => d.falling)) return; // 一枪一中
    Sound.sfx.bang();
    let best = null, bestD = 18;
    for (const d of duck.ducks) {
      if (d.falling || d.fallen) continue;
      if (duck.roundT < d.born) continue;
      const dist = Math.hypot(x - d.x, y - d.y);
      if (dist < bestD) { bestD = dist; best = d; }
    }
    if (best) {
      hitDuck(best);
    } else {
      duck.rings.push({ x, y, r: 4, life: .3 });
      Sound.sfx.click();
    }
  }
});
cv.addEventListener('pointermove', e => {
  if (active !== 'duck') return;
  const rect = cv.getBoundingClientRect();
  duck.aim.x = (e.clientX - rect.left) / rect.width * view.W;
  duck.aim.y = (e.clientY - rect.top) / rect.height * view.H;
});

function renderHeader() {

  let info = '', label = null;

  if (active === 'pinball') {
    const infoMap = {
      cover: armed ? `🎴 <b>${game.slots.length}</b> 张奖券已盖好 · 点「🔀 洗牌」` : `🪙 投币后随机开游戏 · 洗牌发射弹珠`,
      shuffling: `🔀 洗牌中，马上就好…`,
      ready: armed ? `🎱 发射弹珠！` : `🪙 再投币才能继续玩`,
      pulling: `🎰 发射！`, falling: `🎱 弹珠下落中…`,
      settled: `🎱 落袋！`, revealing: `🎴 翻牌揭晓…`,
      over: `🎉 请先在后台添加奖品`,
    };
    info = infoMap[game.phase] || '';
    label = { cover: armed ? '🔀 洗牌' : '🪙 先投币', shuffling: '洗牌中…', ready: armed ? '🎰 发射弹珠' : '🪙 先投币' }[game.phase];
    $('#gameOver').classList.toggle('hidden', game.phase !== 'over');
  } else if (active === 'duck') {
    if (!state.prizes.length) {
      info = '🎉 请先在后台添加奖品';
    } else if (duck.phase === 'idle') {
      info = armed ? `🦆 一群鸭子藏着奖券 · 点「放鸭子」！` : `🪙 投币后随机开游戏 · 一群鸭子藏着奖券`;
      label = armed ? '🦆 放鸭子' : '🪙 先投币';
    } else {
      info = `🔫 快点击打中一只鸭子！<b>${Math.max(0, duck.endTimer).toFixed(0)}</b> 秒后飞走`;
    }
  } else if (active === 'fish') {
    if (!state.prizes.length) {
      info = '🎉 请先在后台添加奖品';
    } else if (fishG.phase === 'idle') {
      info = armed ? `🎣 看准时机甩竿！` : `🪙 投币后随机开游戏 · 池里 ${fishG.fishes.length} 条鱼藏着奖券`;
      label = armed ? '🎣 甩竿下钩' : '🪙 先投币';
    } else if (fishG.phase === 'dropping') {
      info = '🪝 下钩中…';
    } else if (fishG.phase === 'reeling') {
      info = fishG.carry ? '🐟 中鱼了！收线中…' : '🪝 收线中…';
    } else {
      info = '🐟 鱼出水啦！';
    }
  } else if (active === 'soccer') {
    if (!state.prizes.length) {
      info = '🎉 请先在后台添加奖品';
    } else if (soccerG.phase === 'idle') {
      info = armed ? `⚽ 五个球门格各盖着奖券 · 躲开守门员！` : `🪙 投币后随机开游戏 · 足球射门`;
      label = armed ? '⚽ 开始' : '🪙 先投币';
    } else if (soccerG.phase === 'play' && !soccerG.ball) {
      info = `🥅 瞄准空档，点屏幕射门！<b>${Math.max(0, soccerG.timer).toFixed(0)}</b> 秒`;
    } else if (soccerG.phase === 'play') {
      info = '⚽ 球进了吗…';
    }
  } else if (active === 'archery') {
    if (!state.prizes.length) {
      info = '🎉 请先在后台添加奖品';
    } else if (archG.phase === 'idle') {
      info = armed ? `🏹 射中靶子就随机掉奖品 · 越靠靶心越准！` : `🪙 投币后随机开游戏 · 弓箭射击`;
      label = armed ? '🏹 开始' : '🪙 先投币';
    } else if (archG.phase === 'play' && !archG.arrow) {
      info = `🎯 稳住准星，点屏幕放箭！<b>${Math.max(0, archG.timer).toFixed(0)}</b> 秒`;
    } else if (archG.phase === 'play') {
      info = '🏹 箭在飞…';
    }
  }
  $('#wheelInfo').innerHTML = info;
  $('#btnPull').disabled = !label;
  $('#btnPull').textContent = label || '进行中…';
}

  let html = '', lastDay = '';

      </div>`;
  }
  box.innerHTML = html;
}

          const data = JSON.parse(rd.result);
          if (!Array.isArray(data.prizes)) throw new Error('bad');
          if (await confirmModal({ emoji: '💾', title: '导入备份？', desc: '当前数据将被备份内容覆盖。', okText: '导入' })) {
            state = Object.assign({}, structuredClone(DEFAULTS), data);
            save(); renderAll(); toast('备份已恢复 ✓');
          }
        } catch { toast('文件格式不正确'); }
      };
      rd.readAsText(f);
    };
    $('#aClearHist').onclick = async () => {
      if (await confirmModal({ emoji: '📖', title: '清空中奖记录？', desc: '只清除记录，不影响奖品设置。', okText: '清空', danger: true })) {
        state.history = [];
        save(); renderAll(); toast('记录已清空');
      }
    };
    $('#aReset').onclick = async () => {
      if (await confirmModal({ emoji: '⚠️', title: '重置全部奖品？', desc: '将恢复初始的 6 种奖品，中奖记录也会清空，不可恢复！', okText: '我确定', danger: true })) {
        const pin = state.parentPin;
        state = structuredClone(DEFAULTS);
        state.parentPin = pin;
        save(); renderAll(); toast('已重置为初始奖品');
      }
    };
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 启动 ---------- */
function renderAll() {
  renderHeader();
  renderPrizeRows();
  renderHistory();
  GAME_IMPL[active].reset();
  renderHeader();
}
resizeGame();
GAME_ORDER.forEach(g => GAME_IMPL[g].reset());
renderPrizeRows();
renderHistory();
renderHeader();
renderSoundBtn();
requestAnimationFrame(loop);

  </script>
</body>
</html>
